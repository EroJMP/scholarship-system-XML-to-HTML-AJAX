<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasig City Scholarship Portal - Admin Access</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../css/login.css" />
  <style>
    .verification-section {
      flex: 0.8;
      background-color: #f4f5f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .code-input {
      width: 40px;
      height: 50px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="login-container">
      <div class="login-image d-none d-md-block"></div>

      <!-- Login Form Section -->
      <div class="login-form">
        <img src="../asset/logopicture.png" alt="Pasig City Logo" class="logo" />
        <h2 class="text-primary text-center fw-bolder">PASIG CITY SCHOLARSHIP ADMINISTRATION</h2>
        <hr class="divider" />
        <h4 class="text-center mb-4 fw-semibold">Login</h4>
        <div class="role-switch">
          <a class="role-switch-link" href="../../../user/pages/user-login.html">Login as student</a>
          <a class="role-switch-link is-active" href="login.html">Login as admin</a>
        </div>

        <form id="loginForm" class="w-100" style="max-width: 320px;">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="text" id="username" class="form-control" autocomplete="username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" autocomplete="current-password">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="showPasswordLogin" onclick="togglePasswordVisibility('password', 'showPasswordLogin')" />
            <label class="form-check-label" for="showPasswordLogin">
              Show Password
            </label>
          </div>
          <button type="submit" id="loginButton" class="btn btn-primary w-100">
            Login
          </button>
        </form>

        <div class="demo-accounts" id="demoAccounts">
          <button type="button" class="demo-accounts-trigger" aria-expanded="false" aria-controls="demoAccountsPanel">
            Demo accounts
          </button>
          <div class="demo-accounts-panel" id="demoAccountsPanel" role="tooltip">
            <p class="demo-accounts-hint">Hover or click to view. Click an account to fill the form.</p>
            <button type="button" class="demo-account-row" data-email="admin@plpasig.edu.ph" data-password="Admin#2025">
              <span class="demo-account-role">Admin</span>
              <span class="demo-account-email">admin@plpasig.edu.ph</span>
              <span class="demo-account-password">Admin#2025</span>
            </button>
            <button type="button" class="demo-account-row" data-email="staff@plpasig.edu.ph" data-password="Staff#2025">
              <span class="demo-account-role">Staff</span>
              <span class="demo-account-email">staff@plpasig.edu.ph</span>
              <span class="demo-account-password">Staff#2025</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Verification Section -->
      <section id="verificationSection" class="verification-section d-none">
        <div class="verification-form">
          <img class="logo" src="../asset/logopicture.png" alt="Pasig Logo"/>
          <h2 class="text-primary text-center fw-bolder">WELCOME TO PASIG CITY SCHOLARSHIP PORTAL</h2>
          <hr class="divider" />
          <h4 class="text-center mb-4 fw-semibold">Verify Your Identity</h4>
          <p class="text-muted small">Enter the 6-digit code sent to your email</p>

          <div class="d-flex justify-content-center gap-2 mb-3" id="codeInputs">
            <input type="text" maxlength="1" class="form-control code-input text-center" />
            <input type="text" maxlength="1" class="form-control code-input text-center" />
            <input type="text" maxlength="1" class="form-control code-input text-center" />
            <input type="text" maxlength="1" class="form-control code-input text-center" />
            <input type="text" maxlength="1" class="form-control code-input text-center" />
            <input type="text" maxlength="1" class="form-control code-input text-center" />
          </div>

          <button class="btn btn-primary w-100 mb-2" id="verifyCodeBtn">Verify</button>
          <p class="text-muted small">Wait 30 seconds to get a new code. <a href="#">Resend</a></p>
        </div>
      </section>
    </div>
  </div>
  <script src="../js/login.js"></script>
  <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
  </script>
  <script type="text/javascript">
    (function(){
        emailjs.init({
          publicKey: "wzXgijBftES2PKfLj",
        });
    })();
  </script>
</body>
</html>
