<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasig City Scholarship Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/user-login.css" />
</head>
<body>

 <!-- LOGIN SECTION -->
  <section id="loginSection">
    <div class="card text-center">
      <div class="logo-container">
        <img class="logopasigpcs" src="../asset/logopicture.png" alt="Pasig Logo" />
      </div>
      <h6 class="text-primary fw-bold mb-3">PASIG CITY SCHOLARSHIP PORTAL</h6>
      <hr class="divider" />
      <form id="loginForm">
        <div class="mb-3 mt-3 text-start">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
          </div>
        </div>

        <div class="mb-3 text-start">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-3 text-end">
          <a href="user-forgotpass.html" class="text-decoration-none text-primary text-small">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary mb-3">Login</button>
      </form>

      <div class="mt-3 text-small">
        Don't have an account?
        <a href="user-signup.html" class="text-decoration-none text-primary fw-semibold">Register here!</a>
      </div>
    </div>
  </section>

  <!-- VERIFICATION SECTION -->
  <section id="verificationSection" style="display: none;">
    <div class="card text-center">
      <div class="logo-container">
        <img class="logopasigpcs" src="../asset/logopicture.png" alt="Pasig Logo" />
      </div>
      <h6 class="text-primary fw-bold mb-3">WELCOME TO PASIG CITY SCHOLARSHIP PORTAL</h6>
      <hr class="divider" />
      <p class="fw-bold mt-3">Verify Your Identity</p>
      <p class="text-muted small">Enter the 6-digit code sent to your email</p>

      <div class="d-flex justify-content-center gap-2 mb-3" id="codeInputs">
        <input type="text" maxlength="1" class="form-control code-input text-center" />
        <input type="text" maxlength="1" class="form-control code-input text-center" />
        <input type="text" maxlength="1" class="form-control code-input text-center" />
        <input type="text" maxlength="1" class="form-control code-input text-center" />
        <input type="text" maxlength="1" class="form-control code-input text-center" />
        <input type="text" maxlength="1" class="form-control code-input text-center" />
      </div>

      <button class="btn btn-primary w-100 mb-2" id="verifyCodeBtn">Verify</button>
      <p class="text-muted small">Wait 30 seconds to get a new code. <a href="#">Resend</a></p>
    </div>
  </section>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/user-login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</body>
</html>
